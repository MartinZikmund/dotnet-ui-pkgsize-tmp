name: package-size

on:
  workflow_dispatch:
    inputs:
      apple:
        description: 'JSON array of {tfm, lane[, only, tag, override]} Apple jobs (only = case ids for that job, tag = artifact suffix, override = folder of overrides/<tfm> replacing Uno.WinUI assemblies)'
        required: false
        default: '[{"tfm":"net11","lane":"maui-ios"},{"tfm":"net11","lane":"uno-ios"},{"tfm":"net11","lane":"ava-ios"},{"tfm":"net11","lane":"maui-maccatalyst"},{"tfm":"net11","lane":"uno-macos"},{"tfm":"net11","lane":"ava-macos"},{"tfm":"net10","lane":"maui-ios"},{"tfm":"net10","lane":"uno-ios"},{"tfm":"net10","lane":"ava-ios"},{"tfm":"net10","lane":"maui-maccatalyst"},{"tfm":"net10","lane":"uno-macos"},{"tfm":"net10","lane":"ava-macos"}]'
      linux:
        description: 'JSON array of {tfm, fw} Linux jobs ([] for none)'
        required: false
        default: '[{"tfm":"net11","fw":"uno"},{"tfm":"net11","fw":"ava"},{"tfm":"net10","fw":"uno"},{"tfm":"net10","fw":"ava"}]'
      only:
        description: 'Optional space-separated case ids to run (default: all)'
        required: false
        default: ''
      timeout:
        description: 'Per-build cap in seconds'
        required: false
        default: '1200'
      sim:
        description: 'JSON array of {tfm, cases} simulator smoke jobs; cases = lines of "<name> <msbuild args>" separated by | ([] for none)'
        required: false
        default: '[]'

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  MSBUILDDISABLENODEREUSE: '1'
  SDK_NET10: '10.0.404'
  SDK_NET11: '11.0.100'

jobs:
  apple:
    if: ${{ github.event.inputs.apple != '[]' }}
    name: ${{ matrix.tfm }} ${{ matrix.lane }} ${{ matrix.tag }}
    runs-on: xcode-27   # macOS + Xcode 27.x (public preview image); .NET 10.0.4xx/11.0.1xx iOS packs bind the 27.2 SDK
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(github.event.inputs.apple) }}
    env:
      PKG_ROOT: ${{ github.workspace }}
      BUILD_TIMEOUT: ${{ github.event.inputs.timeout || '1200' }}
    steps:
      - uses: actions/checkout@v4
      - name: Runner and Xcode
        run: |
          sw_vers; uname -m; sysctl -n hw.ncpu; df -h "$HOME" | tail -1
          ls -d /Applications/Xcode*.app
          XC=/Applications/Xcode_27.2.app   # matches the 27.2 iOS/Mac Catalyst workload packs
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9][0-9.]*\.app$' | grep -v beta | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $XC"; DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -version
      - name: Install .NET SDK and workloads
        run: |
          V=$SDK_NET10; [ "${{ matrix.tfm }}" = net11 ] && V=$SDK_NET11
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$V" --install-dir "$HOME/dn" --no-path
          echo "$HOME/dn" >> "$GITHUB_PATH"; echo "DOTNET_ROOT=$HOME/dn" >> "$GITHUB_ENV"
          export PATH="$HOME/dn:$PATH" DOTNET_ROOT="$HOME/dn"
          dotnet --version
          case "${{ matrix.lane }}" in
            maui-*) dotnet workload install maui-ios maui-maccatalyst ;;
            *-ios)  dotnet workload install ios ;;
            *)      echo "desktop lane: no workload needed" ;;
          esac
          dotnet workload list
      - name: Build lane
        env:
          UNO_OVERRIDE: ${{ matrix.override }}
        run: |
          lane="${{ matrix.lane }}"; fw="${lane%%-*}"; grp="${lane#*-}"
          bash scripts/mac-run.sh "${{ matrix.tfm }}" "$fw" "$grp" ${{ matrix.only || github.event.inputs.only }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.tfm }}-${{ matrix.lane }}${{ matrix.tag && format('-{0}', matrix.tag) || '' }}
          path: |
            results/
            logs/
          if-no-files-found: warn

  sim:
    if: ${{ github.event.inputs.sim != '[]' && github.event.inputs.sim != '' }}
    name: sim ${{ matrix.tfm }} ${{ matrix.tag }}
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event.inputs.sim) }}
    env:
      PKG_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          XC=/Applications/Xcode_27.2.app
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9][0-9.]*\.app$' | grep -v beta | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XC/Contents/Developer" xcrun simctl list devices available | head -40
      - name: Install .NET SDK and workloads
        run: |
          V=$SDK_NET10; [ "${{ matrix.tfm }}" = net11 ] && V=$SDK_NET11
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$V" --install-dir "$HOME/dn" --no-path
          echo "$HOME/dn" >> "$GITHUB_PATH"; echo "DOTNET_ROOT=$HOME/dn" >> "$GITHUB_ENV"
          export PATH="$HOME/dn:$PATH" DOTNET_ROOT="$HOME/dn"
          dotnet workload install ios
      - name: Smoke
        env:
          UNO_OVERRIDE: ${{ matrix.override }}
        run: |
          echo '${{ matrix.cases }}' | tr '|' '\n' | while read -r name args; do
            [ -z "$name" ] && continue
            echo "=== $name: $args"
            bash scripts/sim-smoke.sh "${{ matrix.tfm }}" "$name" $args
          done
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-${{ matrix.tfm }}-${{ matrix.tag }}
          path: logs/
          if-no-files-found: warn

  linux:
    if: ${{ github.event.inputs.linux != '[]' }}
    name: ${{ matrix.tfm }} ${{ matrix.fw }} linux nativeaot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event.inputs.linux) }}
    env:
      PKG_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        run: |
          V=$SDK_NET10; [ "${{ matrix.tfm }}" = net11 ] && V=$SDK_NET11
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$V" --install-dir "$HOME/dn" --no-path
          echo "$HOME/dn" >> "$GITHUB_PATH"; echo "DOTNET_ROOT=$HOME/dn" >> "$GITHUB_ENV"
          clang --version | head -1; dpkg -l zlib1g-dev | tail -1
      - name: Build
        run: bash scripts/linux-run.sh "${{ matrix.tfm }}" "${{ matrix.fw }}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.tfm }}-${{ matrix.fw }}
          path: |
            results/
            logs/
          if-no-files-found: warn
